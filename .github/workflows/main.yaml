name: CI/CD for Note App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/note-app-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/note-app-frontend:latest
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    env:
      VM_USER: fedora
      VM_HOST: 192.168.64.4
      SSH_KEY_PATH: $HOME/Downloads/my-ci-cd-key
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Ensure VM directories exist
        run: |
          ssh -i "$SSH_KEY_PATH" $VM_USER@$VM_HOST << EOF
            mkdir -p ~/nginx
          EOF

      - name: Copy Files to VM
        run: |
          scp -i "$SSH_KEY_PATH" docker-compose.yml $VM_USER@$VM_HOST:~/
          scp -i "$SSH_KEY_PATH" .env $VM_USER@$VM_HOST:~/
          scp -i "$SSH_KEY_PATH" ./nginx/default.conf $VM_USER@$VM_HOST:~/nginx/

      - name: Deploy via SSH
        run: |
          ssh -i "$SSH_KEY_PATH" $VM_USER@$VM_HOST << EOF
            set -e  # Exit on any failure

            # Export Docker credentials
            export DOCKER_USER=$DOCKER_USER
            export DOCKER_PASS=$DOCKER_PASS

            # Login to Docker Hub
            docker login -u \$DOCKER_USER -p \$DOCKER_PASS

            # Pull latest images
            docker pull \$DOCKER_USER/note-app-backend:latest
            docker pull \$DOCKER_USER/note-app-frontend:latest
            docker pull mongo:latest

            # Stop and remove existing containers safely
            if docker compose ps -q | grep .; then
              docker compose down
            fi

            # Start containers with updated images
            docker compose up -d --remove-orphans

            # Clean up dangling images
            docker image prune -af

            echo "Deployment completed successfully."
          EOF

