name: CI/CD for Note App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/note-app-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/note-app-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        run: |
          echo "${{ secrets.AWS_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          scp -o StrictHostKeyChecking=no -i private_key.pem docker-compose.yml ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/
          scp -o StrictHostKeyChecking=no -i private_key.pem .env ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/
          scp -o StrictHostKeyChecking=no -i private_key.pem ./nginx/default.conf ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/nginx/

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << 'EOF'
            # Login to Docker Hub
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            
            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/note-app-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/note-app-frontend:latest
            docker pull mongo:latest

            # Stop and remove existing containers
            docker compose down || true

            # Start services with docker compose
            docker compose up -d

            # Clean up old images
            docker image prune -af
          EOF
